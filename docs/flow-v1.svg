<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1c1b18"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4362c"/>
    </marker>
    <style>
      .t{font-size:15px;fill:#1c1b18;font-weight:700}
      .s{font-size:12px;fill:#45413a}
      .l{font-size:12px;fill:#c4362c}
      .g{font-size:12px;fill:#7a7366}
      .ai{fill:#fbf8f2;stroke:#1c1b18;stroke-width:1.6}
      .pg{fill:#dbe9ef;stroke:#2c6e8f;stroke-width:1.6}
      .ck{fill:#f6dcd6;stroke:#c4362c;stroke-width:1.8}
      .hu{fill:#fff4e6;stroke:#d47a22;stroke-width:1.6;stroke-dasharray:5 4}
      .e{fill:none;stroke:#1c1b18;stroke-width:1.5}
      .r{fill:none;stroke:#c4362c;stroke-width:1.5;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#f4efe6"/>
  <text x="30" y="36" font-size="20" font-weight="900" fill="#1c1b18">graph v1：檢查都放在生成之後</text>

  <!-- N0 -->
  <rect class="ai" x="30" y="60" width="170" height="54" rx="8"/>
  <text class="t" x="44" y="84">N0 規劃討論</text><text class="s" x="44" y="103">範圍、讀者、第一批來源</text>
  <path class="e" d="M115 114V150" marker-end="url(#a)"/>

  <!-- ingest loop -->
  <rect x="20" y="152" width="960" height="190" rx="12" fill="none" stroke="#7a7366" stroke-dasharray="3 5"/>
  <text class="g" x="34" y="172">每篇來源重複一次（ingest loop）</text>
  <rect class="pg" x="34" y="190" width="150" height="58" rx="8"/>
  <text class="t" x="48" y="214">N1 取得資料</text><text class="s" x="48" y="234">fetch.py存進raw/</text>
  <rect class="ai" x="222" y="190" width="150" height="58" rx="8"/>
  <text class="t" x="236" y="214">N2 討論</text><text class="s" x="236" y="234">AI寫重點和問題</text>
  <rect class="hu" x="410" y="190" width="150" height="58" rx="8"/>
  <text class="t" x="424" y="214">學生回覆</text><text class="s" x="424" y="234">決定強調什麼</text>
  <rect class="ai" x="598" y="190" width="150" height="58" rx="8"/>
  <text class="t" x="612" y="214">N3 生成頁面</text><text class="s" x="612" y="234">摘要、概念、目錄、log</text>
  <rect class="ck" x="786" y="190" width="170" height="58" rx="8"/>
  <text class="t" x="800" y="214">C1 Wiki檢查</text><text class="s" x="800" y="234">lint_wiki.py（W01–W12）</text>
  <path class="e" d="M184 219H218" marker-end="url(#a)"/>
  <path class="e" d="M372 219H406" marker-end="url(#a)"/>
  <path class="e" d="M560 219H594" marker-end="url(#a)"/>
  <path class="e" d="M748 219H782" marker-end="url(#a)"/>
  <path class="r" d="M871 248C871 300 673 300 673 252" marker-end="url(#ar)"/>
  <text class="l" x="700" y="304">不通過：回N3修改（最多3次）</text>
  <text class="g" x="800" y="330">通過 → 下一篇來源</text>

  <!-- slides loop -->
  <path class="e" d="M500 342V392" marker-end="url(#a)"/>
  <text class="g" x="512" y="372">來源都處理完</text>
  <rect x="20" y="394" width="960" height="170" rx="12" fill="none" stroke="#7a7366" stroke-dasharray="3 5"/>
  <text class="g" x="34" y="414">簡報（query loop）</text>
  <rect class="ai" x="34" y="430" width="150" height="58" rx="8"/>
  <text class="t" x="48" y="454">N4 查詢Wiki</text><text class="s" x="48" y="474">讀目錄、選頁、回答</text>
  <rect class="ai" x="222" y="430" width="150" height="58" rx="8"/>
  <text class="t" x="236" y="454">N5 整理大綱</text><text class="s" x="236" y="474">每頁目的與Wiki頁</text>
  <rect class="ai" x="410" y="430" width="150" height="58" rx="8"/>
  <text class="t" x="424" y="454">N6 產生簡報</text><text class="s" x="424" y="474">寫slides/deck.html</text>
  <rect class="ck" x="598" y="430" width="200" height="58" rx="8"/>
  <text class="t" x="612" y="454">C2 簡報檢查</text><text class="s" x="612" y="474">check_slides.py＋AI審查</text>
  <rect class="pg" x="830" y="430" width="126" height="58" rx="8"/>
  <text class="t" x="844" y="454">N7 發佈</text><text class="s" x="844" y="474">build.py → Pages</text>
  <path class="e" d="M184 459H218" marker-end="url(#a)"/>
  <path class="e" d="M372 459H406" marker-end="url(#a)"/>
  <path class="e" d="M560 459H594" marker-end="url(#a)"/>
  <path class="e" d="M798 459H826" marker-end="url(#a)"/>
  <path class="r" d="M698 488C698 540 485 540 485 492" marker-end="url(#ar)"/>
  <text class="l" x="520" y="546">不通過：重生出錯的頁（最多3次）</text>
  <path class="r" d="M640 430C640 380 109 380 109 252" marker-end="url(#ar)"/>
  <text class="l" x="126" y="292">Wiki缺資料：回到N1補來源</text>

  <!-- legend -->
  <rect class="ai" x="30" y="590" width="22" height="16" rx="3"/><text class="s" x="58" y="603">AI節點</text>
  <rect class="pg" x="130" y="590" width="22" height="16" rx="3"/><text class="s" x="158" y="603">程式節點</text>
  <rect class="ck" x="240" y="590" width="22" height="16" rx="3"/><text class="s" x="268" y="603">檢查節點</text>
  <rect class="hu" x="350" y="590" width="22" height="16" rx="3"/><text class="s" x="378" y="603">學生</text>
  <path class="r" d="M440 598H480" marker-end="url(#ar)"/><text class="s" x="488" y="603">重複執行的路線</text>
</svg>
